<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video → Audio</title>
<style>
body { font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#111; color:white; }
.container { background: rgba(0,0,0,0.7); padding:20px; border-radius:10px; text-align:center; width:300px; }
#drop { border:2px dashed white; padding:20px; cursor:pointer; margin-bottom:10px; }
audio { width:100%; margin-top:10px; }
button { padding:10px; margin-top:5px; border:none; border-radius:5px; cursor:pointer; background:#4caf50; color:white; }
</style>
</head>
<body>
<div class="container">
<h2>Video → MP3</h2>
<div id="drop">Drag & Drop a video or click</div>
<input type="file" id="fileInput" accept="video/*" style="display:none">
<button id="convert">Convert</button>
<p id="status"></p>
<a id="download" href="#" download style="display:block;color:#0f0;margin-top:5px;">Download MP3</a>
<audio id="audio" controls></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.2/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log:true });

let file = null;
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const convertBtn = document.getElementById('convert');
const status = document.getElementById('status');
const audioElem = document.getElementById('audio');
const downloadLink = document.getElementById('download');

drop.addEventListener('click', ()=>fileInput.click());
drop.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); drop.style.borderColor='yellow'; });
drop.addEventListener('dragleave', e=>{ e.preventDefault(); e.stopPropagation(); drop.style.borderColor='white'; });
drop.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation(); drop.style.borderColor='white';
    file = e.dataTransfer.files[0];
    drop.textContent = file.name;
});
fileInput.addEventListener('change', e=>{ file = e.target.files[0]; drop.textContent = file.name; });

convertBtn.addEventListener('click', async ()=>{
    if(!file){ alert('Pick a video first'); return; }
    status.textContent = 'Loading ffmpeg...';
    if(!ffmpeg.isLoaded()) await ffmpeg.load();
    const inName = 'input' + file.name.match(/\.[^.]+$/)?.[0];
    const outName = 'output.mp3';
    ffmpeg.FS('writeFile', inName, await fetchFile(file));
    status.textContent = 'Converting...';
    await ffmpeg.run('-i', inName, '-vn', '-ar', '44100', '-ab', '192k', '-y', outName);
    const data = ffmpeg.FS('readFile', outName);
    const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    audioElem.src = url;
    downloadLink.href = url;
    status.textContent = 'Done!';
});
</script>
</body>
</html>
